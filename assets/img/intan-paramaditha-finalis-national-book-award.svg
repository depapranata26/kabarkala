<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a1e"/><stop offset="1" stop-color="#6d1a3f"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hbg)"/>
  <!-- spotlights -->
  <polygon points="300,0 380,0 200,675 40,675" fill="url(#spot)"/>
  <polygon points="820,0 900,0 1160,675 1000,675" fill="url(#spot)"/>
  <polygon points="560,0 640,0 720,675 480,675" fill="url(#spot)" opacity=".7"/>
  <!-- stage -->
  <ellipse cx="600" cy="600" rx="420" ry="60" fill="#3f0f26"/>
  <ellipse cx="600" cy="590" rx="420" ry="60" fill="#521730"/>
  <!-- book silhouette -->
  <g fill="#120409">
    <path d="M500,240 h200 a18,18 0 0 1 18,18 v230 a18,18 0 0 1 -18,18 h-200 z" opacity="0"/>
    <rect x="470" y="240" width="260" height="330" rx="14"/>
    <rect x="470" y="240" width="36" height="330" rx="14" fill="#1f0a12"/>
    <rect x="506" y="240" width="6" height="330" fill="#0a0307"/>
  </g>
  <!-- pages -->
  <g fill="#f9a8d4" opacity=".92">
    <rect x="512" y="258" width="198" height="8" rx="4"/>
    <rect x="512" y="282" width="170" height="8" rx="4"/>
    <rect x="512" y="306" width="198" height="8" rx="4"/>
    <rect x="512" y="330" width="150" height="8" rx="4"/>
    <rect x="512" y="354" width="198" height="8" rx="4"/>
  </g>
  <!-- laurel leaves -->
  <g fill="#fde68a" opacity=".85">
    <ellipse cx="380" cy="430" rx="14" ry="44" transform="rotate(28 380 430)"/>
    <ellipse cx="820" cy="430" rx="14" ry="44" transform="rotate(-28 820 430)"/>
    <ellipse cx="350" cy="350" rx="12" ry="36" transform="rotate(45 350 350)"/>
    <ellipse cx="850" cy="350" rx="12" ry="36" transform="rotate(-45 850 350)"/>
    <ellipse cx="410" cy="270" rx="10" ry="30" transform="rotate(60 410 270)"/>
    <ellipse cx="790" cy="270" rx="10" ry="30" transform="rotate(-60 790 270)"/>
  </g>
  <!-- music notes -->
  <g fill="#f9a8d4">
    <circle cx="240" cy="480" r="16"/><rect x="252" y="410" width="8" height="72"/>
  </g>
  <g fill="#fde68a">
    <circle cx="250" cy="480" r="5"/><circle cx="950" cy="480" r="5"/><circle cx="600" cy="150" r="5"/>
    <circle cx="450" cy="120" r="4"/><circle cx="760" cy="110" r="4"/>
  </g>
  <!-- audience hands -->
  <g fill="#120409">
    <ellipse cx="120" cy="660" rx="70" ry="60"/><ellipse cx="300" cy="670" rx="80" ry="55"/>
    <ellipse cx="900" cy="670" rx="80" ry="55"/><ellipse cx="1080" cy="660" rx="70" ry="60"/>
  </g>
</svg>
