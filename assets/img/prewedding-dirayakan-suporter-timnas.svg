<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0a1e"/><stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hbg)"/>
  <!-- spotlights -->
  <polygon points="300,0 380,0 200,675 40,675" fill="url(#spot)"/>
  <polygon points="820,0 900,0 1160,675 1000,675" fill="url(#spot)"/>
  <polygon points="560,0 640,0 720,675 480,675" fill="url(#spot)" opacity=".7"/>
  <!-- stage -->
  <ellipse cx="600" cy="600" rx="420" ry="60" fill="#4a0e2e"/>
  <ellipse cx="600" cy="590" rx="420" ry="60" fill="#831843"/>
  <!-- couple silhouette -->
  <g fill="#0f0520">
    <circle cx="545" cy="390" r="40"/>
    <rect x="513" y="428" width="64" height="125" rx="28"/>
    <circle cx="660" cy="390" r="40"/>
    <rect x="628" y="428" width="64" height="125" rx="28"/>
  </g>
  <!-- camera flash -->
  <g>
    <line x1="470" y1="440" x2="430" y2="390" stroke="#0f0520" stroke-width="14" stroke-linecap="round"/>
    <circle cx="422" cy="378" r="26" fill="#0f0520"/>
    <circle cx="422" cy="378" r="12" fill="#fde68a"/>
  </g>
  <!-- confetti notes -->
  <g fill="#fecdd3">
    <circle cx="380" cy="300" r="16"/><rect x="392" y="230" width="8" height="72"/>
    <circle cx="830" cy="260" r="16"/><rect x="842" y="190" width="8" height="72"/>
    <rect x="392" y="230" width="70" height="10" transform="rotate(-8 392 230)"/>
  </g>
  <g fill="#fde68a">
    <circle cx="250" cy="480" r="5"/><circle cx="950" cy="480" r="5"/><circle cx="600" cy="150" r="5"/>
    <circle cx="450" cy="120" r="4"/><circle cx="760" cy="110" r="4"/>
  </g>
  <!-- crowd hands -->
  <g fill="#0f0520">
    <ellipse cx="120" cy="660" rx="70" ry="60"/><ellipse cx="300" cy="670" rx="80" ry="55"/>
    <ellipse cx="900" cy="670" rx="80" ry="55"/><ellipse cx="1080" cy="660" rx="70" ry="60"/>
  </g>
</svg>
