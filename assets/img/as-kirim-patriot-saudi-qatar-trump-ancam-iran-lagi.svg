<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="oceang2" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#172554"/>
    </radialGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="1" stop-color="#0b1e3f"/>
    </linearGradient>
    <radialGradient id="radar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <g fill="#ffffff">
    <circle cx="100" cy="80" r="2.5" opacity=".9"/><circle cx="250" cy="180" r="2" opacity=".6"/>
    <circle cx="420" cy="70" r="2.5" opacity=".8"/><circle cx="700" cy="120" r="2" opacity=".6"/>
    <circle cx="900" cy="70" r="2.5" opacity=".9"/><circle cx="1080" cy="160" r="2" opacity=".6"/>
    <circle cx="150" cy="500" r="2.5" opacity=".7"/><circle cx="1050" cy="520" r="2.5" opacity=".7"/>
    <circle cx="330" cy="600" r="2" opacity=".5"/><circle cx="870" cy="600" r="2" opacity=".5"/>
  </g>
  <!-- radar sweep behind globe -->
  <circle cx="600" cy="337" r="290" fill="url(#radar)"/>
  <g fill="none" stroke="#f59e0b" stroke-width="4" opacity=".55">
