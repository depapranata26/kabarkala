  </g>
  <!-- globe -->
  <circle cx="600" cy="337" r="215" fill="url(#oceang2)"/>
  <g fill="none" stroke="#bfdbfe" stroke-width="5" opacity=".85">
    <ellipse cx="600" cy="337" rx="215" ry="85"/>
    <ellipse cx="600" cy="337" rx="150" ry="215"/>
    <ellipse cx="600" cy="337" rx="70" ry="215"/>
    <line x1="385" y1="337" x2="815" y2="337"/>
    <ellipse cx="600" cy="337" rx="215" ry="215"/>
  </g>
  <!-- defense arc markers -->
  <g fill="#fbbf24">
    <circle cx="600" cy="122" r="12"/>
    <circle cx="792" cy="337" r="12"/>
    <circle cx="408" cy="337" r="12"/>
  </g>
  <g stroke="#fbbf24" stroke-width="4" fill="none" opacity=".7">
    <path d="M600,122 L600,170"/><path d="M792,337 L744,337"/><path d="M408,337 L456,337"/>
  </g>
  <g fill="#86efac" opacity=".9">
