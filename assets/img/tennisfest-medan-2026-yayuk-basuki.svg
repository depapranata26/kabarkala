<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/><stop offset=".55" stop-color="#0e7490"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dusk)"/>
  <!-- sun -->
  <circle cx="600" cy="470" r="120" fill="#fef3c7" opacity=".95"/>
  <circle cx="600" cy="470" r="150" fill="#fef3c7" opacity=".25"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity=".35">
    <ellipse cx="220" cy="150" rx="130" ry="34"/><ellipse cx="980" cy="120" rx="150" ry="38"/>
    <ellipse cx="700" cy="220" rx="110" ry="28"/><ellipse cx="420" cy="260" rx="90" ry="24"/>
  </g>
  <!-- ground -->
  <rect y="520" width="1200" height="155" fill="#083344"/>
  <rect y="520" width="1200" height="14" fill="#0c4a5e"/>
  <!-- tennis court -->
  <g>
    <rect x="380" y="470" width="440" height="180" rx="8" fill="#0f766e" opacity=".85"/>
    <rect x="400" y="490" width="400" height="140" fill="none" stroke="#e0f2f1" stroke-width="6"/>
    <line x1="600" y1="490" x2="600" y2="630" stroke="#e0f2f1" stroke-width="6"/>
    <line x1="400" y1="560" x2="800" y2="560" stroke="#e0f2f1" stroke-width="5"/>
  </g>
  <!-- big tennis ball -->
  <circle cx="880" cy="380" r="110" fill="#d9f99d"/>
  <path d="M800,320 q60,60 0,120" fill="none" stroke="#f8fafc" stroke-width="10"/>
  <path d="M960,320 q-60,60 0,120" fill="none" stroke="#f8fafc" stroke-width="10"/>
  <circle cx="310" cy="400" r="60" fill="#d9f99d" opacity=".9"/>
  <path d="M266,364 q36,36 0,72" fill="none" stroke="#f8fafc" stroke-width="6"/>
  <path d="M354,364 q-36,36 0,72" fill="none" stroke="#f8fafc" stroke-width="6"/>
  <!-- racket -->
  <g transform="rotate(-25 600 260)">
    <ellipse cx="600" cy="180" rx="55" ry="75" fill="none" stroke="#fbbf24" stroke-width="14"/>
    <g stroke="#fef3c7" stroke-width="3" opacity=".8">
      <line x1="555" y1="130" x2="645" y2="230"/><line x1="645" y1="130" x2="555" y2="230"/>
      <line x1="600" y1="105" x2="600" y2="255"/><line x1="545" y1="180" x2="655" y2="180"/>
    </g>
    <rect x="592" y="255" width="16" height="120" rx="8" fill="#b45309"/>
  </g>
  <!-- city silhouettes -->
  <g fill="#0a2e3a">
    <rect x="60" y="380" width="90" height="145"/><rect x="170" y="420" width="70" height="105"/>
    <rect x="1040" y="380" width="100" height="145"/>
  </g>
  <g fill="#fde68a" opacity=".9">
    <rect x="80" y="400" width="12" height="12"/><rect x="110" y="430" width="12" height="12"/>
    <rect x="1065" y="400" width="12" height="12"/>
  </g>
  <!-- birds -->
  <g stroke="#083344" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M150,200 q18,-14 36,0 q18,-14 36,0"/>
    <path d="M1050,180 q14,-11 28,0 q14,-11 28,0"/>
  </g>
</svg>
