<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12082e"/><stop offset=".6" stop-color="#2b1470"/><stop offset="1" stop-color="#0e2a5e"/>
    </linearGradient>
    <radialGradient id="flare" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".95"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sp)"/>
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="2.5" opacity=".9"/><circle cx="240" cy="170" r="2" opacity=".6"/>
    <circle cx="420" cy="60" r="2.5" opacity=".8"/><circle cx="700" cy="110" r="2" opacity=".6"/>
    <circle cx="910" cy="60" r="2.5" opacity=".9"/><circle cx="1090" cy="150" r="2" opacity=".6"/>
    <circle cx="140" cy="490" r="2.5" opacity=".7"/><circle cx="1060" cy="510" r="2.5" opacity=".7"/>
    <circle cx="320" cy="600" r="2" opacity=".5"/><circle cx="880" cy="590" r="2" opacity=".5"/>
    <circle cx="520" cy="540" r="2.5" opacity=".6"/><circle cx="760" cy="220" r="2" opacity=".7"/>
  </g>
  <!-- planet with ring -->
  <circle cx="950" cy="200" r="70" fill="#7c3aed"/>
  <circle cx="930" cy="180" r="22" fill="#a78bfa" opacity=".5"/>
  <ellipse cx="950" cy="200" rx="130" ry="30" fill="none" stroke="#22d3ee" stroke-width="8" opacity=".7" transform="rotate(-18 950 200)"/>
  <!-- orbit path -->
  <ellipse cx="600" cy="400" rx="440" ry="200" fill="none" stroke="#22d3ee" stroke-width="4" opacity=".35" transform="rotate(-12 600 400)"/>
  <!-- rocket -->
  <g transform="translate(430,300) rotate(-35)">
    <ellipse cx="0" cy="150" rx="34" ry="90" fill="url(#flare)" opacity=".55"/>
    <path d="M0,-120 C44,-70 44,20 0,60 C-44,20 -44,-70 0,-120 Z" fill="url(#rocket)"/>
    <circle cx="0" cy="-52" r="20" fill="#1e3a8a" stroke="#e2e8f0" stroke-width="6"/>
    <path d="M-40,30 L-78,92 L-40,78 Z" fill="#ef4444"/>
    <path d="M40,30 L78,92 L40,78 Z" fill="#ef4444"/>
    <rect x="-14" y="52" width="28" height="30" rx="8" fill="#475569"/>
  </g>
  <!-- satellite -->
  <g transform="translate(880,470)">
    <rect x="-34" y="-34" width="68" height="68" rx="10" fill="#312e81" stroke="#67e8f9" stroke-width="5"/>
    <rect x="-110" y="-18" width="60" height="36" fill="#1e40af" stroke="#67e8f9" stroke-width="4"/>
    <rect x="50" y="-18" width="60" height="36" fill="#1e40af" stroke="#67e8f9" stroke-width="4"/>
    <line x1="0" y1="-34" x2="0" y2="-70" stroke="#67e8f9" stroke-width="6"/>
    <circle cx="0" cy="-78" r="9" fill="#f472b6"/>
  </g>
  <!-- ground arc -->
  <path d="M0,640 Q600,560 1200,640 L1200,675 L0,675 Z" fill="#0b1030" opacity=".9"/>
</svg>