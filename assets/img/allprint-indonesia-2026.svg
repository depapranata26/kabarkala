<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/><stop offset="1" stop-color="#3b1d5e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity=".9"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#tbg)"/>
  <!-- circuit traces -->
  <g stroke="#4c1d95" stroke-width="6" fill="none" opacity=".9">
    <path d="M0,120 H300 L380,200 H620"/><path d="M0,300 H220 L300,380 H560"/>
    <path d="M1200,150 H900 L820,230 H640"/><path d="M1200,420 H980 L900,340 H700"/>
    <path d="M150,675 V540 L230,460"/><path d="M1050,675 V540 L970,460"/>
    <path d="M600,0 V140"/><path d="M600,675 V540"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="300" cy="120" r="14"/><circle cx="620" cy="200" r="14"/><circle cx="220" cy="300" r="14"/>
    <circle cx="900" cy="150" r="14"/><circle cx="640" cy="230" r="14"/><circle cx="980" cy="420" r="14"/>
    <circle cx="150" cy="540" r="14"/><circle cx="1050" cy="540" r="14"/><circle cx="600" cy="140" r="14"/>
  </g>
  <!-- central chip -->
  <circle cx="600" cy="340" r="150" fill="url(#glow)" opacity=".35"/>
  <rect x="480" y="220" width="240" height="240" rx="26" fill="#3b1d5e" stroke="#f0abfc" stroke-width="6"/>
  <rect x="530" y="270" width="140" height="140" rx="12" fill="#312e81" stroke="#67e8f9" stroke-width="4"/>
  <g stroke="#f0abfc" stroke-width="8" stroke-linecap="round">
    <line x1="510" y1="260" x2="510" y2="220"/><line x1="560" y1="260" x2="560" y2="220"/>
    <line x1="610" y1="260" x2="610" y2="220"/><line x1="660" y1="260" x2="660" y2="220"/>
    <line x1="510" y1="420" x2="510" y2="460"/><line x1="560" y1="420" x2="560" y2="460"/>
    <line x1="610" y1="420" x2="610" y2="460"/><line x1="660" y1="420" x2="660" y2="460"/>
  </g>
  <circle cx="600" cy="340" r="34" fill="#f0abfc"/>
  <circle cx="600" cy="340" r="34" fill="none" stroke="#a5f3fc" stroke-width="4" opacity=".7">
    <animate attributeName="r" values="34;52" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
