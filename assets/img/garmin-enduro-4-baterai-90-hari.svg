<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a12"/><stop offset="1" stop-color="#134e2e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a3e635" stop-opacity=".9"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#tbg)"/>
  <!-- circuit traces -->
  <g stroke="#166534" stroke-width="6" fill="none" opacity=".9">
    <path d="M0,120 H300 L380,200 H620"/><path d="M0,300 H220 L300,380 H560"/>
    <path d="M1200,150 H900 L820,230 H640"/><path d="M1200,420 H980 L900,340 H700"/>
    <path d="M150,675 V540 L230,460"/><path d="M1050,675 V540 L970,460"/>
    <path d="M600,0 V140"/><path d="M600,675 V540"/>
  </g>
  <g fill="#4ade80">
    <circle cx="300" cy="120" r="14"/><circle cx="620" cy="200" r="14"/><circle cx="220" cy="300" r="14"/>
    <circle cx="900" cy="150" r="14"/><circle cx="640" cy="230" r="14"/><circle cx="980" cy="420" r="14"/>
    <circle cx="150" cy="540" r="14"/><circle cx="1050" cy="540" r="14"/><circle cx="600" cy="140" r="14"/>
  </g>
  <!-- sun + endurance dial -->
  <circle cx="600" cy="340" r="150" fill="url(#glow)" opacity=".35"/>
  <circle cx="600" cy="340" r="110" fill="none" stroke="#a3e635" stroke-width="10"/>
  <circle cx="600" cy="340" r="80" fill="none" stroke="#4ade80" stroke-width="4" stroke-dasharray="14 10"/>
  <g stroke="#d9f99d" stroke-width="10" stroke-linecap="round">
    <line x1="600" y1="340" x2="600" y2="255"/>
    <line x1="600" y1="340" x2="648" y2="368"/>
  </g>
  <circle cx="600" cy="340" r="16" fill="#d9f99d"/>
</svg>
