<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57534e"/><stop offset=".5" stop-color="#78716c"/><stop offset="1" stop-color="#a8a29e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#haze)"/>
  <!-- dim sun behind haze -->
  <circle cx="600" cy="200" r="90" fill="#fef3c7" opacity=".45"/>
  <circle cx="600" cy="200" r="130" fill="#fef3c7" opacity=".15"/>
  <!-- drifting smoke bands -->
  <g fill="#e7e5e4" opacity=".28">
    <ellipse cx="250" cy="300" rx="260" ry="46"/><ellipse cx="950" cy="360" rx="300" ry="52"/>
    <ellipse cx="600" cy="430" rx="340" ry="44"/><ellipse cx="150" cy="480" rx="220" ry="40"/>
    <ellipse cx="1050" cy="180" rx="240" ry="42"/>
  </g>
  <g fill="#d6d3d1" opacity=".22">
    <ellipse cx="700" cy="250" rx="280" ry="38"/><ellipse cx="350" cy="160" rx="200" ry="36"/>
  </g>
  <!-- school building silhouette -->
  <g>
    <rect x="380" y="380" width="440" height="170" fill="#292524"/>
    <rect x="350" y="340" width="500" height="50" rx="6" fill="#292524"/>
    <rect x="560" y="300" width="80" height="50" fill="#292524"/>
    <polygon points="600,260 556,300 644,300" fill="#292524"/>
    <g fill="#fbbf24" opacity=".8">
      <rect x="410" y="410" width="34" height="34"/><rect x="466" y="410" width="34" height="34"/>
      <rect x="522" y="410" width="34" height="34"/><rect x="700" y="410" width="34" height="34"/>
      <rect x="756" y="410" width="34" height="34"/><rect x="410" y="466" width="34" height="34"/>
      <rect x="756" y="466" width="34" height="34"/>
    </g>
    <rect x="578" y="470" width="44" height="80" fill="#1c1917"/>
  </g>
  <!-- trees in haze -->
  <g fill="#292524" opacity=".85">
    <ellipse cx="180" cy="440" rx="70" ry="90"/><rect x="168" y="500" width="24" height="60"/>
    <ellipse cx="1030" cy="450" rx="80" ry="95"/><rect x="1016" y="510" width="28" height="55"/>
  </g>
  <!-- ground -->
  <rect y="550" width="1200" height="125" fill="#1c1917"/>
  <!-- mask hint: floating mask shape -->
  <g transform="translate(985,120)" opacity=".92">
    <path d="M0,0 C40,-26 90,-26 130,0 L118,52 C80,30 50,30 12,52 Z" fill="#38bdf8"/>
    <path d="M-14,6 C-34,2 -44,-6 -50,-20 M144,6 C164,2 174,-6 180,-20" stroke="#e0f2fe" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>