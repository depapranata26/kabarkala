<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d"/><stop offset=".55" stop-color="#15803d"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dawn)"/>
  <circle cx="600" cy="470" r="120" fill="#fef3c7" opacity=".95"/>
  <circle cx="600" cy="470" r="150" fill="#fef3c7" opacity=".25"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity=".35">
    <ellipse cx="220" cy="150" rx="130" ry="34"/><ellipse cx="980" cy="120" rx="150" ry="38"/>
    <ellipse cx="700" cy="220" rx="110" ry="28"/><ellipse cx="420" cy="260" rx="90" ry="24"/>
  </g>
  <!-- ground -->
  <rect y="520" width="1200" height="155" fill="#083344"/>
  <rect y="520" width="1200" height="14" fill="#14532d"/>
  <!-- monas-like obelisk -->
  <g>
    <rect x="560" y="180" width="80" height="345" fill="#082f3f"/>
    <polygon points="600,120 560,180 640,180" fill="#082f3f"/>
    <polygon points="600,120 588,150 612,150" fill="#fbbf24"/>
    <rect x="520" y="505" width="160" height="22" fill="#082f3f"/>
  </g>
  <!-- city silhouettes -->
  <g fill="#0a2e3a">
    <rect x="60" y="380" width="90" height="145"/><rect x="170" y="420" width="70" height="105"/>
    <rect x="260" y="350" width="100" height="175"/><rect x="830" y="370" width="95" height="155"/>
    <rect x="945" y="410" width="75" height="115"/><rect x="1040" y="350" width="100" height="175"/>
  </g>
  <g fill="#fde68a" opacity=".9">
    <rect x="80" y="400" width="12" height="12"/><rect x="110" y="430" width="12" height="12"/>
    <rect x="285" y="375" width="12" height="12"/><rect x="315" y="410" width="12" height="12"/>
    <rect x="855" y="395" width="12" height="12"/><rect x="1065" y="375" width="12" height="12"/>
  </g>
  <!-- birds -->
  <g stroke="#083344" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M880,200 q18,-14 36,0 q18,-14 36,0"/>
    <path d="M300,180 q14,-11 28,0 q14,-11 28,0"/>
