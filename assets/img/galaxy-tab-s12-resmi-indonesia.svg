<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="tbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12062e"/><stop offset="1" stop-color="#2b1470"/>
    </linearGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".9"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#tbg2)"/>
  <!-- circuit traces -->
  <g stroke="#5b21b6" stroke-width="6" fill="none" opacity=".9">
    <path d="M0,120 H300 L380,200 H620"/><path d="M0,300 H220 L300,380 H560"/>
    <path d="M1200,150 H900 L820,230 H640"/><path d="M1200,420 H980 L900,340 H700"/>
    <path d="M150,675 V540 L230,460"/><path d="M1050,675 V540 L970,460"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="300" cy="120" r="14"/><circle cx="220" cy="300" r="14"/>
    <circle cx="900" cy="150" r="14"/><circle cx="980" cy="420" r="14"/>
    <circle cx="150" cy="540" r="14"/><circle cx="1050" cy="540" r="14"/>
  </g>
  <!-- glow behind tablet -->
  <circle cx="600" cy="340" r="180" fill="url(#glow2)" opacity=".4"/>
  <!-- tablet -->
  <g transform="rotate(-8 600 340)">
    <rect x="420" y="180" width="360" height="320" rx="28" fill="#0b0620" stroke="#a78bfa" stroke-width="8"/>
    <rect x="448" y="208" width="304" height="264" rx="10" fill="#312e81"/>
    <!-- screen content -->
    <g fill="none" stroke="#67e8f9" stroke-width="5" opacity=".9">
      <path d="M480,420 L560,320 L640,380 L720,280"/>
    </g>
    <circle cx="560" cy="320" r="10" fill="#22d3ee"/>
    <circle cx="640" cy="380" r="10" fill="#f0abfc"/>
    <circle cx="720" cy="280" r="10" fill="#facc15"/>
    <rect x="480" y="440" width="120" height="16" rx="8" fill="#a78bfa" opacity=".8"/>
    <rect x="610" y="440" width="90" height="16" rx="8" fill="#67e8f9" opacity=".8"/>
  </g>
  <!-- stylus -->
  <g transform="rotate(30 830 420)">
    <rect x="822" y="330" width="16" height="170" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="4"/>
    <polygon points="822,500 838,500 830,532" fill="#7c3aed"/>
  </g>
  <!-- AI sparkles -->
  <g fill="#fde68a" opacity=".95">
    <path d="M950,120 l12,28 28,12 -28,12 -12,28 -12,-28 -28,-12 28,-12 z"/>
    <path d="M220,180 l9,21 21,9 -21,9 -9,21 -9,-21 -21,-9 21,-9 z"/>
    <path d="M1000,480 l9,21 21,9 -21,9 -9,21 -9,-21 -21,-9 21,-9 z"/>
  </g>
</svg>
